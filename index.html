<!doctype html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <title>Mercería de Oriente · Catálogo</title>
  <meta name="description" content="Catálogo de Mercería de Oriente: máquinas de coser, hilos, telas y bisutería. Precios en dólares.">
  <link rel="icon" href="logo.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; object-src 'none'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ ENTRADA: fotos de fondo, logo y botón Entrar ============ -->
<section id="entrada" class="entrada">
  <div id="entradaFondo" class="fondo-carrusel" aria-hidden="true"></div>
  <div class="velo" aria-hidden="true"></div>
  <button class="btn ghost sm tema-flotante" data-tema aria-label="Cambiar tema">☀ Tema claro</button>

  <div class="entrada-centro">
    <img class="entrada-logo" src="logo.png" alt="Logo de Mercería de Oriente">
    <p class="entrada-tag">Máquinas · Hilos · Telas · Bisutería</p>
    <h1>Bienvenido a <em>Mercería de Oriente</em></h1>
  </div>

  <a class="entrada-entrar" href="#catalogo" id="btnEntrar">Entrar</a>
</section>

<!-- ============ ENCABEZADO ============ -->
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#entrada">
      <img class="logo" src="logo.png" alt="Logo de Mercería de Oriente">
      <span class="marca">Mercería<br><small>de Oriente</small></span>
    </a>
    <div class="acciones">
      <button class="btn ghost sm" data-tema aria-label="Cambiar tema">☀ Tema claro</button>
      <a class="btn sm" id="btnWa" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>
</header>

<main class="wrap" id="catalogo">

  <!-- Banner de fotos (las mismas del carrusel de la entrada) -->
  <div class="banner" id="banner" hidden>
    <div id="bannerSlides"></div>
    <span class="banner-contador" id="bannerContador"></span>
    <button class="banner-flecha prev" id="bannerPrev" aria-label="Foto anterior">‹</button>
    <button class="banner-flecha next" id="bannerNext" aria-label="Foto siguiente">›</button>
    <div class="banner-puntos" id="bannerPuntos"></div>
  </div>

  <section class="hero">
    <span class="eyebrow">Catálogo</span>
    <h1>Todo para <em>coser y crear</em></h1>
    <p class="muted">Máquinas de coser, hilos, telas y bisutería. Precios en dólares.</p>
  </section>

  <div class="toolbar">
    <input id="buscar" class="input" type="search" placeholder="Buscar producto…" autocomplete="off">
    <select id="orden" aria-label="Ordenar">
      <option value="destacados">Destacados</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="nombre">Nombre A–Z</option>
    </select>
  </div>

  <div class="chips" id="chips"></div>
  <p class="muted small" id="conteo"></p>

  <p class="error" id="avisoCarga" hidden></p>
  <div class="grid" id="grid"></div>
  <p class="vacio" id="vacio" hidden></p>
</main>

<footer class="pie">
  <div class="wrap">
    © Mercería de Oriente · WhatsApp +58 424-8901496 · Precios en dólares (USD)
  </div>
</footer>

<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="comun.js"></script>
<script src="catalogo.js"></script>
</body>
</html>
